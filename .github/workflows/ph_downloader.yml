name: PH downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL of the video"
        required: true
        type: string

      output_folder:
        description: "Folder where the video will be saved"
        required: false
        type: string
        default: "downloads"

      quality:
        description: "Video quality (yt-dlp format selector)"
        required: true
        type: string
        default: "bestvideo[height<=720]+bestaudio/best[ext=mp4]/best"

      archive_name:
        description: "Base name for the RAR archive"
        required: false
        type: string
        default: "video"

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            bc \
            rar

      - name: Write cookies from secret
        run: |
          echo "${{ secrets.COOKIE_PH }}" > cookies.txt

      - name: Debug info
        run: |
          set -x

          echo "===== FILE LIST ====="
          ls -lah

          echo "===== COOKIES FILE ====="
          wc -l cookies.txt || true
          head -n 5 cookies.txt || true

          echo "===== YT-DLP VERSION ====="
          yt-dlp --version

      - name: Download video (retry up to 5 times)
        id: download
        shell: bash
        run: |
          set -x

          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"

          touch marker

          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "===== DOWNLOAD ATTEMPT $((RETRY_COUNT+1))/$MAX_RETRIES ====="

            yt-dlp \
              --verbose \
              --no-progress \
              --cookies cookies.txt \
              --force-ipv4 \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/123.0.0.0 Safari/537.36" \
              --output "./$FOLDER/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --format "${{ github.event.inputs.quality }}" \
              --merge-output-format mp4 \
              --retries 3 \
              --fragment-retries 10 \
              --no-check-certificate \
              --geo-bypass \
              --ignore-errors \
              --newline \
              "${{ github.event.inputs.url }}"

            NEW_FILE=$(find "$FOLDER" -type f -newer marker -print -quit)

            if [ -n "$NEW_FILE" ]; then
              echo "Download succeeded: $NEW_FILE"
              SUCCESS=true
              break
            fi

            echo "Download failed. Retrying in 5 seconds..."
            RETRY_COUNT=$((RETRY_COUNT+1))
            sleep 5
          done

          if [ "$SUCCESS" = false ]; then
            echo "All download attempts failed."
            exit 1
          fi

          FILENAME=$(basename "$NEW_FILE")
          SIZE_BYTES=$(stat -c %s "$NEW_FILE")

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT

          echo "Downloaded file: $NEW_FILE"
          echo "File size: $SIZE_BYTES bytes"

      - name: Conditional split (if file > 99 MB)
        id: split
        shell: bash
        run: |
          set -x

          FOLDER="${{ github.event.inputs.output_folder }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE_BYTES="${{ steps.download.outputs.size_bytes }}"

          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)

          THRESHOLD_MB=99

          cd "$FOLDER"

          if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then
            echo "File exceeds ${THRESHOLD_MB} MB. Splitting..."

            RANDOM_HEX=$(openssl rand -hex 3)

            ARCHIVE_NAME="${{ github.event.inputs.archive_name }}_${RANDOM_HEX}"

            rar a -v95m -m5 -ep1 "${ARCHIVE_NAME}.rar" "$FILENAME"

            rm "$FILENAME"

            echo "split_done=true" >> $GITHUB_OUTPUT

            echo "RAR parts created:"
            ls -lh *.rar

          else
            echo "File size is under limit. No split required."

            echo "split_done=false" >> $GITHUB_OUTPUT
          fi

      - name: Show final files
        run: |
          echo "===== FINAL FILES ====="
          ls -Rlah

      - name: Commit and push to repository
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FOLDER/"

          git commit -m "Add downloaded video(s)" || echo "Nothing to commit"

          git push
